<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="443.jpg" type="image/png">
    <title>Tamaño del escritorio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">
        <h1>Tamaño del monitor</h1>

        <p>Ingresa el ancho de la pantalla en píxeles:</p>

        <input
            type="number" 
            id="ancho" 
            placeholder="Ej: 1000"
        >
        <br>

        <button id="calcular">Determinar tamaño</button>

        <p id="resultado"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
